# Run 2: fine-tune run 1 (runs/turing/best.pt) on Data_v1 (variant_001, photo backgrounds). See exploration/run2/changes.md.
# Submit with --init-checkpoint runs/turing/best.pt (jobs/train_turing.sbatch: INIT=...).
base: turing.yaml

data:
  root: Data_v1
  num_workers: 8

loss:
  class_weights:
    cord_or_tie: 1.5               # run 1: 1.0 (cord was the weakest thin class); clDice weights unchanged

train:
  out_dir: runs/v1_finetune
  snapshot_subdir: snapshots       # epoch_XXX.pt resume points go to <out_dir>/snapshots/
  epochs: 15
  lr_encoder: 3.0e-5               # 1/3 of run 1
  lr_decoder: 3.0e-4
  freeze_encoder_epochs: 0
  warmup_epochs: 0.3               # ~525 steps (1752 steps/epoch)
  val_every: 3                     # full validation (6000 views): epochs 3, 6, 9, 12, 15
  val_mode: full
  snapshot_every: 3
